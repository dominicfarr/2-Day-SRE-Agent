# from dominicfarr/dev-standards@6fb3d2fe1159bb2b77615307691e8327de7add7a
# Base gates. Every hook is pinned by rev: set revs with `pre-commit autoupdate`,
# never by hand. Any hook that fails or changes files stops the commit: review,
# `git add -u`, commit again. Stacks merge their hook fragment into this file.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # actionlint only runs shellcheck on workflow scripts when shellcheck is on
  # PATH, so shellcheck is a documented prerequisite as well as a hook.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Also lint workflow templates under templates/, where the standards
        # repo keeps its Sonar workflow so it never runs. A no-op elsewhere.
        files: ^(\.github/workflows/|templates/.*\.ya?ml$)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # Commit-message linter. pre-commit provisions Node for it, so the project
  # needs no npm. The rules live in commitlint.config.mjs; see CONTRIBUTING.md.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Pass the message file explicitly, so the hook also works with
        # `pre-commit run --hook-stage commit-msg --commit-msg-filename <file>`.
        pass_filenames: true
        # Keep this on the same major version as the @commitlint/cli the
        # hook's rev ships (`npm view @commitlint/config-conventional version`).
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]

  # from dominicfarr/dev-standards@6fb3d2fe1159bb2b77615307691e8327de7add7a
  # Python hook fragment. Each hook runs the project's own tools through
  # `uv run --locked`, so the versions come from uv.lock, never from a
  # pre-commit-managed environment. `language: unsupported` needs
  # pre-commit 4.4.0 or later. Any hook that fails or changes files stops
  # the commit.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: unsupported
        types_or: [python, pyi]
        require_serial: true

      # Checks the whole project, so a change that breaks a caller elsewhere
      # is caught too.
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false

      # A fast full run, stopping at the first failure. If the suite grows
      # slow, add pytest-testmon to the dev group and append `--testmon` to
      # run only the tests related to the change. pytest exits 5 when it
      # collects no tests, which passes here so a project with no tests yet
      # can still commit; any other failure stops the commit.
      - id: pytest
        name: pytest
        entry: >-
          bash -c 'uv run --locked pytest -x -q || { code=$?;
          [ "$code" -eq 5 ] || exit "$code"; }'
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
