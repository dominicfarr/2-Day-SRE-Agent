[project]
name = "sre-agent"
version = "0.1.0"
description = "A local agent that diagnoses injected incidents in a toy microservice system, writes an RCA, and rolls back only when the evidence crosses a threshold."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-ai-slim[mcp]>=2.68.0",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]
